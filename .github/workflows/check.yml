name: Validate and build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source snapshot
        run: |
          cp public/data/snapshot.json /tmp/psa-snapshot-original.json
          python scripts/prepare_data.py
          diff -u /tmp/psa-snapshot-original.json public/data/snapshot.json
      - name: Install, test and build
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build
